name: CI Tests

on:
  push:
    branches: [ main, dev, SolidV1.0 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # -----------------------
    # 1. CHECKOUT REPO
    # -----------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -----------------------
    # 2. SETUP DOCKER BUILDX (recommended)
    # -----------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # -----------------------
    # 3. LOGIN TO GHCR (optional)
    # -----------------------
    # If you want to push docker images later, uncomment this:
    # - name: Login to GitHub Container Registry
    #   uses: docker/login-action@v2
    #   with:
    #     registry: ghcr.io
    #     username: ${{ github.actor }}
    #     password: ${{ secrets.GITHUB_TOKEN }}

    # -----------------------
    # 4. BUILD DOCKER IMAGE
    # -----------------------
    - name: Build Docker Image
      run: |
        docker build -t cs325_project2 .

    # -----------------------
    # 5. RUN TESTS IN DOCKER
    # -----------------------
    - name: Run pytest suite inside Docker
      run: |
        docker run cs325_project2

    # -----------------------
    # 6. (OPTIONAL) ARTIFACTS
    # -----------------------
    # Upload test results or logs if you want
    # - name: Upload test logs
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: test-logs
    #     path: ./logs
